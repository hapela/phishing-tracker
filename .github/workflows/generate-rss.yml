name: 🔄 Generate RSS Feed

on:
  push:
    paths:
      - 'reports/**'
      - 'scripts/generate_rss.py'
    branches:
      - main
  workflow_dispatch:  # Manuell auslösen möglich

jobs:
  generate-rss:
    runs-on: ubuntu-latest
    
    steps:
      - name: ✅ Repository auschecken
        uses: actions/checkout@v4
      
      - name: 🐍 Python 3.11 einrichten
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: 📝 RSS-Feed generieren
        run: python scripts/generate_rss.py
      
      - name: 📤 Änderungen committen und pushen
        run: |
          git config user.name "RSS Feed Bot"
          git config user.email "bot@noreply.github.com"
          git add feed.xml
          git diff --quiet && git diff --staged --quiet || (git commit -m "🔄 RSS-Feed aktualisiert" && git push)
