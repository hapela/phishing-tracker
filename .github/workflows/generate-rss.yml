name: RSS-Feeds generieren

on:
  push:
    paths:
      - "reports/**"
      - "scripts/generate_rss.py"
      - ".github/workflows/generate-rss.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-rss:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: RSS-Feeds generieren
        run: python scripts/generate_rss.py

      - name: Änderungen committen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add feed_isb.xml feed_user.xml

          if git diff --cached --quiet; then
            echo "Keine Änderungen an den RSS-Feeds."
          else
            git commit -m "RSS-Feeds aktualisiert"
            git push
          fi
