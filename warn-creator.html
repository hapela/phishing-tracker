<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sicherheitsmeldung erstellen</title>

  <style>
    :root {
      --bg: #f1f5f9;
      --card: #ffffff;
      --text: #172033;
      --muted: #64748b;
      --border: #dbe3ee;
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --danger: #dc2626;
      --success: #15803d;
      --radius: 18px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, #dbeafe 0, transparent 32rem),
        var(--bg);
      color: var(--text);
      font-family:
        Inter, ui-sans-serif, system-ui, -apple-system,
        BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .page {
      width: min(1100px, calc(100% - 32px));
      margin: 40px auto;
    }

    .header {
      margin-bottom: 24px;
    }

    .header h1 {
      margin: 0 0 8px;
      font-size: clamp(1.8rem, 4vw, 3rem);
      letter-spacing: -0.04em;
    }

    .header p {
      margin: 0;
      color: var(--muted);
    }

    .card {
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(219, 227, 238, 0.9);
      border-radius: var(--radius);
      box-shadow: 0 20px 60px rgba(15, 23, 42, 0.1);
      padding: clamp(20px, 4vw, 40px);
    }

    .section {
      margin-bottom: 30px;
    }

    .section h2 {
      margin: 0 0 16px;
      font-size: 1.15rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #334155;
      font-size: .9rem;
      font-weight: 700;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 11px;
      padding: 12px 14px;
      color: var(--text);
      background: #fff;
      font: inherit;
      transition: border-color .2s, box-shadow .2s;
    }

    input:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 4px rgba(37, 99, 235, .12);
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    .hint {
      display: block;
      margin-top: 6px;
      color: var(--muted);
      font-size: .78rem;
    }

    .dropzone {
      border: 2px dashed #b8c5d8;
      border-radius: 14px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      background: #f8fafc;
      transition: .2s;
    }

    .dropzone:hover,
    .dropzone.active {
      border-color: var(--primary);
      background: #eff6ff;
    }

    .dropzone strong {
      display: block;
      margin-bottom: 6px;
    }

    #preview {
      display: none;
      width: min(100%, 650px);
      max-height: 340px;
      object-fit: contain;
      margin: 18px auto 0;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(15, 23, 42, .16);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
    }

    button {
      border: 0;
      border-radius: 11px;
      padding: 13px 18px;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
      transition: .2s;
    }

    button:hover {
      transform: translateY(-1px);
    }

    .primary {
      color: white;
      background: var(--primary);
    }

    .primary:hover {
      background: var(--primary-dark);
    }

    .secondary {
      color: #334155;
      background: #e2e8f0;
    }

    .folder {
      color: #1e3a8a;
      background: #dbeafe;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 14px 16px;
      border-radius: 11px;
      font-weight: 700;
    }

    .message.success {
      display: block;
      color: #166534;
      background: #dcfce7;
    }

    .message.error {
      display: block;
      color: #991b1b;
      background: #fee2e2;
    }

    @media (max-width: 700px) {
      .page {
        width: min(100% - 20px, 1100px);
        margin: 20px auto;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="header">
      <h1>Sicherheitsmeldung erstellen</h1>
      <p>JSON-Report und Screenshot für den Sicherheitsmeldungs-Tracker erstellen.</p>
    </header>

    <section class="card">
      <form id="meldungForm">
        <div class="section">
          <h2>Allgemeine Informationen</h2>

          <div class="grid">
            <div>
              <label for="id">ID</label>
              <input id="id" name="id" type="text">
            </div>

            <div>
              <label for="melder">Melder</label>
              <input id="melder" name="melder" type="text" required>
            </div>

            <div>
              <label for="datum_meldung">Datum der Meldung</label>
              <input id="datum_meldung" name="datum_meldung" type="datetime-local" required>
            </div>

            <div>
              <label for="datum_mail">Datum der E-Mail</label>
              <input id="datum_mail" name="datum_mail" type="datetime-local">
            </div>

            <div>
              <label for="status">Status</label>
              <select id="status" name="status" required>
                <option value="open">Offen</option>
                <option value="in_progress">In Bearbeitung</option>
                <option value="closed">Geschlossen</option>
              </select>
            </div>
          </div>
        </div>

        <div class="section">
          <h2>E-Mail-Daten</h2>

          <div class="grid">
            <div>
              <label for="absender">Absender</label>
              <input id="absender" name="absender" type="text" required>
            </div>

            <div>
              <label for="betreff">Betreff</label>
              <input id="betreff" name="betreff" type="text" required>
            </div>

            <div class="full">
              <label for="gefaehrlicher_link">Gefährlicher Link</label>
              <input id="gefaehrlicher_link" name="gefaehrlicher_link" type="url">
            </div>
          </div>
        </div>

        <div class="section">
          <h2>Beschreibungen</h2>

          <div class="grid">
            <div>
              <label for="beschreibung_ISB">Beschreibung für ISB</label>
              <textarea id="beschreibung_ISB" name="beschreibung_ISB"></textarea>
            </div>

            <div>
              <label for="beschreibung_nutzer">Beschreibung für Nutzer</label>
              <textarea id="beschreibung_nutzer" name="beschreibung_nutzer"></textarea>
            </div>

            <div class="full">
              <label for="Maßnahmen_nutzer">Maßnahmen für Nutzer</label>
              <textarea id="Maßnahmen_nutzer" name="Maßnahmen_nutzer"></textarea>
            </div>
          </div>
        </div>

        <div class="section">
          <h2>Screenshot</h2>

          <label for="screenshotFile" class="dropzone" id="dropzone">
            <strong>Screenshot auswählen oder hierher ziehen</strong>
            <span class="hint">Alternativ kann ein Bild mit Strg+V eingefügt werden.</span>
            <input id="screenshotFile" type="file" accept="image/png,image/jpeg,image/webp" hidden>
            <img id="preview" alt="Vorschau des Screenshots">
          </label>

          <label for="screenshot">Screenshot-Pfad oder URL</label>
          <input id="screenshot" name="screenshot" type="text">
          <span class="hint">
            Wird beim Speichern automatisch auf <code>reports/ID.png</code> gesetzt.
          </span>
        </div>

        <div class="actions">
          <button class="folder" type="button" id="chooseFolder">
            reports-Ordner auswählen
          </button>

          <button class="primary" type="submit">
            JSON und PNG speichern
          </button>

          <button class="secondary" type="reset">
            Zurücksetzen
          </button>
        </div>

        <div id="message" class="message"></div>
      </form>
    </section>
  </main>

  <script>
    const form = document.querySelector("#meldungForm");
    const fileInput = document.querySelector("#screenshotFile");
    const dropzone = document.querySelector("#dropzone");
    const preview = document.querySelector("#preview");
    const message = document.querySelector("#message");

    let screenshotBlob = null;
    let reportsDirectory = null;

    const fieldNames = [
      "id",
      "melder",
      "datum_meldung",
      "datum_mail",
      "absender",
      "betreff",
      "beschreibung_ISB",
      "beschreibung_nutzer",
      "Maßnahmen_nutzer",
      "status",
      "gefaehrlicher_link",
      "screenshot"
    ];

    function showMessage(text, type) {
      message.textContent = text;
      message.className = `message ${type}`;
    }

    function makeId() {
      const date = new Date().toISOString().slice(0, 10);
      const random = Math.floor(Math.random() * 10000)
        .toString()
        .padStart(4, "0");

      return `${date}-${random}`;
    }

    function setImage(blob) {
      screenshotBlob = blob;
      preview.src = URL.createObjectURL(blob);
      preview.style.display = "block";
    }

    function setDefaultDates() {
      const now = new Date();
      const local = new Date(now.getTime() - now.getTimezoneOffset() * 60000)
        .toISOString()
        .slice(0, 16);

      document.querySelector("#id").value = makeId();
      document.querySelector("#datum_meldung").value = local;
      document.querySelector("#datum_mail").value = local;
    }

    function fillFromUrl() {
      const params = new URLSearchParams(window.location.search);

      fieldNames.forEach((name) => {
        if (params.has(name)) {
          const field = document.getElementById(name);

          if (field) {
            field.value = params.get(name);
          }
        }
      });
    }

    function getFormData() {
      const data = {};

      fieldNames.forEach((name) => {
        const field = document.getElementById(name);
        data[name] = field ? field.value.trim() : "";
      });

      if (!data.id) {
        data.id = makeId();
      }

      if (!data.datum_meldung) {
        data.datum_meldung = new Date().toISOString();
      }

      return data;
    }

    async function saveToDirectory(directory, filename, data) {
      const fileHandle = await directory.getFileHandle(filename, {
        create: true
      });

      const writable = await fileHandle.createWritable();
      await writable.write(data);
      await writable.close();
    }

    function downloadFile(blob, filename) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = filename;
      link.click();

      URL.revokeObjectURL(url);
    }

    document.querySelector("#chooseFolder").addEventListener("click", async () => {
      if (!window.showDirectoryPicker) {
        showMessage(
          "Dieser Browser unterstützt keine direkte Ablage. Bitte Chrome oder Edge verwenden.",
          "error"
        );
        return;
      }

      try {
        reportsDirectory = await window.showDirectoryPicker({
          mode: "readwrite"
        });

        showMessage(
          "Der reports-Ordner wurde ausgewählt. Neue Meldungen werden dort gespeichert.",
          "success"
        );
      } catch {
        showMessage("Die Auswahl des Ordners wurde abgebrochen.", "error");
      }
    });

    fileInput.addEventListener("change", () => {
      if (fileInput.files[0]) {
        setImage(fileInput.files[0]);
      }
    });

    ["dragenter", "dragover"].forEach((eventName) => {
      dropzone.addEventListener(eventName, (event) => {
        event.preventDefault();
        dropzone.classList.add("active");
      });
    });

    ["dragleave", "drop"].forEach((eventName) => {
      dropzone.addEventListener(eventName, (event) => {
        event.preventDefault();
        dropzone.classList.remove("active");
      });
    });

    dropzone.addEventListener("drop", (event) => {
      const file = event.dataTransfer.files[0];

      if (file && file.type.startsWith("image/")) {
        setImage(file);
      }
    });

    document.addEventListener("paste", (event) => {
      const imageItem = [...event.clipboardData.items]
        .find((item) => item.type.startsWith("image/"));

      if (imageItem) {
        setImage(imageItem.getAsFile());
        event.preventDefault();
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!screenshotBlob) {
        showMessage("Bitte zuerst einen Screenshot auswählen oder einfügen.", "error");
        return;
      }

      const data = getFormData();
      const jsonFilename = `${data.id}.json`;
      const pngFilename = `${data.id}.png`;

      data.screenshot = `reports/${pngFilename}`;

      const json = JSON.stringify({
        meldungen: [data]
      }, null, 2);

      try {
        if (reportsDirectory) {
          await saveToDirectory(
            reportsDirectory,
            jsonFilename,
            json
          );

          await saveToDirectory(
            reportsDirectory,
            pngFilename,
            screenshotBlob
          );

          showMessage(
            `Die Dateien wurden direkt in reports gespeichert: ${jsonFilename} und ${pngFilename}`,
            "success"
          );
        } else {
          downloadFile(
            new Blob([json], { type: "application/json" }),
            jsonFilename
          );

          downloadFile(screenshotBlob, pngFilename);

          showMessage(
            "Die Dateien wurden heruntergeladen. Verschiebe sie anschließend in den Ordner reports.",
            "success"
          );
        }
      } catch (error) {
        showMessage(`Fehler beim Speichern: ${error.message}`, "error");
      }
    });

    form.addEventListener("reset", () => {
      setTimeout(() => {
        screenshotBlob = null;
        preview.removeAttribute("src");
        preview.style.display = "none";
        setDefaultDates();
        fillFromUrl();
      }, 0);
    });

    setDefaultDates();
    fillFromUrl();
  </script>
</body>
</html>
